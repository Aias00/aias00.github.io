<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Aias 的个人主页。">
<meta name="theme-color" content="#f5f4ef">
<title>Aias · 个人主页</title>
<style>
:root{color-scheme:light;--paper:#f5f4ef;--ink:#242923;--muted:#6b7168;--line:#d8dbd2;--green:#456b4c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}.page{max-width:1100px;margin:auto;padding:38px 48px;min-height:100svh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;align-items:center;gap:20px}header{font-size:14px}.brand{font-weight:700;letter-spacing:.12em}.label{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.dot{height:7px;width:7px;border-radius:50%;background:var(--green)}main{flex:1;display:flex;align-items:center;padding:100px 0 120px}.intro{max-width:760px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.2em;margin:0 0 26px}h1{font-size:clamp(76px,13vw,148px);font-weight:500;letter-spacing:-.075em;line-height:1;margin:0 0 32px}h1 span{color:var(--green)}.description{font-size:18px;color:var(--muted);line-height:1.9;margin:0 0 38px}.link{display:inline-flex;gap:42px;align-items:center;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:100px;padding:15px 23px;font-size:14px;transition:background .2s,border-color .2s}.link:hover{background:#e8ece3;border-color:var(--green)}a:focus-visible{outline:3px solid var(--green);outline-offset:5px}footer{border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:12px;line-height:1.6}footer a{color:inherit;text-decoration:none}footer a:hover{text-decoration:underline}@media(max-width:600px){.page{padding:26px 24px}main{padding:85px 0}.description{font-size:16px}footer{align-items:flex-start;flex-direction:column;gap:8px}}
</style>
</head>
<body>
<div class="page">
<header><a class="brand" href="./" style="color:inherit;text-decoration:none" aria-label="Aias 首页">AIAS</a><div class="label"><span class="dot" aria-hidden="true"></span>个人主页</div></header>
<main><section class="intro" aria-labelledby="hello"><p class="eyebrow">HELLO, WORLD</p><h1 id="hello">I'm Aias<span>.</span></h1><p class="description">欢迎来到我的个人主页。<br>在这里，与我连接。</p><a class="link" href="https://github.com/Aias00">在 GitHub 找到我 <span aria-hidden="true">↗</span></a></section></main>
<footer><span>© 2026 Aias</span><a href="https://github.com/Aias00">github.com/Aias00 ↗</a></footer>
</div>
</body>
</html>
